services:
  - type: web
    name: mlb-daily-picks
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium --with-deps
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: USERS
        value: "admin:picks2026"
      - key: STATMUSE_EMAIL
        sync: false
      - key: STATMUSE_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/opt/render/project/.browsers"
